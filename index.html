<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NC-Tracker</title>
<meta name="description" content="Notendurchschnitt berechnen, Stundenplan hochladen, mit deiner Klasse vergleichen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a68'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='34' font-weight='700' text-anchor='middle' fill='%23ffd166'%3E1,0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="paper">
  <header class="masthead">
    <div class="brand">
      <span class="brand-mark">Ø</span>
      <div>
        <h1>NC-Tracker</h1>
        <p class="sub" id="modeLine">Lädt …</p>
      </div>
    </div>
    <button class="who" id="whoBtn" type="button" hidden></button>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="nc" aria-selected="true">Mein NC</button>
    <button role="tab" data-tab="plan">Stundenplan</button>
    <button role="tab" data-tab="groups">Gruppen</button>
    <button role="tab" data-tab="board">Rangliste</button>
  </nav>

  <main id="view"></main>

  <footer class="foot">
    <span>Noten 1–6 oder Punkte 0–15 · NC = Durchschnitt der ausgewählten Fächer</span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="subjects.js"></script>
<script src="app.js"></script>
</body>
</html>
